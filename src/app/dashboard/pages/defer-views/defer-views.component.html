<app-title title="Defer Views - Blocs"></app-title>
<section class="grid grid-cols-1">
  @defer(){
  <app-heavy-loaders-slow cssClass="bg-blue-800" />
  }@placeholder {
  <p
    class="h-[600px] w-full bg-gradient-to-t from-gray-200 to-gray-400 animate-pulse rounded-lg"
  >
    Cargando...
  </p>
  } @defer(on idle){
  <app-heavy-loaders-slow cssClass="bg-green-800" />
  }@placeholder {
  <p
    class="h-[600px] w-full bg-gradient-to-t from-gray-200 to-gray-400 animate-pulse rounded-lg"
  >
    Cargando...
  </p>
  } @defer(on viewport){
  <app-heavy-loaders-slow cssClass="bg-red-800" />
  }@placeholder {
  <p
    class="h-[600px] w-full bg-gradient-to-t from-gray-200 to-gray-400 animate-pulse rounded-lg"
  >
    Cargando...
  </p>
  }
</section>
