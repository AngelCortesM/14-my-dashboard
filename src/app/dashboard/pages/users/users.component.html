<app-title title="Listado de Usurarios "></app-title>

<ul>
  @for(user of usersService.users(); track user.id){
  <li class="flex items-center mx-2 cursor-pointer">
    <img
      [srcset]="user.avatar"
      [alt]="user.first_name"
      class="rounded w-14 mb-3"
    />
    <a
      [routerLink]="['/dashboard/user', user.id]"
      routerLinkActive="router-link-active"
      class="mx-5 hover:underline"
    >
      {{ user.first_name }} {{ user.last_name }}
    </a>
  </li>
  }@empty {

  <h3 class="mx-5 hover :underline">Cargando data: Loading...</h3>

  }
</ul>
